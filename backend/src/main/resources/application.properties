spring.application.name=aluguel-carros

# Lê variáveis de backend/.env (se existir). Veja .env.example
spring.config.import=optional:file:.env[.properties]

# Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Cria/atualiza as tabelas automaticamente no Supabase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mostra a mensagem dos erros no JSON de resposta
server.error.include-message=always

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=7200000

# CORS (origem do front-end)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
